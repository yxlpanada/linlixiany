<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>邻里集 · 小区闲置交换平台</title>
<style>
  :root{
    --green:#20a26a; --green-d:#178257; --green-l:#e7f6ee;
    --amber:#f59e0b; --amber-l:#fef3e2;
    --blue:#3b82f6; --blue-l:#e8f1fe;
    --bg:#f3f5f4; --card:#fff;
    --ink:#1f2a2e; --muted:#6b7a80; --line:#eceeed;
    --shadow:0 6px 22px rgba(20,40,30,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#dfe4e2;color:var(--ink);display:flex;justify-content:center;align-items:center;min-height:100vh}
  #app{width:100%;max-width:430px;height:100vh;max-height:920px;background:var(--bg);position:relative;
    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.22);border-radius:26px;display:flex;flex-direction:column}
  @media (max-width:460px){#app{border-radius:0;max-height:none;height:100vh}}
  .topbar{background:linear-gradient(135deg,var(--green),#27b579);color:#fff;padding:14px 18px 12px;
    flex-shrink:0;display:flex;align-items:center;gap:10px;position:relative;z-index:5}
  .topbar .loc{font-size:12px;opacity:.9}
  .topbar h1{font-size:17px;font-weight:700;margin-top:2px}
  .topbar .title-wrap{flex:1;min-width:0}
  .back-btn{cursor:pointer;font-size:22px;line-height:1;padding-right:2px}
  .screen{flex:1;overflow-y:auto;padding-bottom:80px;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{width:0}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-size:11px;cursor:pointer;position:relative}
  .tab.active{color:var(--green)}
  .tab .ic{font-size:21px;line-height:1}
  .tab .pub{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--green),#2bbd7f);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-22px;
    box-shadow:0 6px 16px rgba(32,162,106,.4);font-weight:300}
  .badge-dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;
    background:#ef4444;color:#fff;border-radius:8px;font-size:10px;line-height:16px;text-align:center}
  .sec{padding:14px 16px}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;
    cursor:pointer;background:var(--green);color:#fff;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--green-l);color:var(--green-d)}
  .btn.amber{background:var(--amber)}
  .btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.sm{padding:9px 14px;font-size:13px;width:auto;border-radius:10px;display:inline-block}
  .btn.wx{background:#07c160}
  .input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;
    font-size:15px;background:#fafbfb;color:var(--ink);font-family:inherit;outline:none;transition:.15s}
  .input:focus,select:focus,textarea:focus{border-color:var(--green);background:#fff}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
  .tag.bid{background:var(--amber-l);color:#b45309}
  .tag.swap{background:var(--blue-l);color:#1d4ed8}
  .tag.free{background:var(--green-l);color:var(--green-d)}
  .tag.done{background:#eee;color:#666}
  .tag.gray{background:#f1f3f2;color:#788}
  .muted{color:var(--muted)}.center{text-align:center}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
  .empty .big{font-size:44px;margin-bottom:10px}
  .auth-wrap{padding:0;height:100%;display:flex;flex-direction:column;
    background:linear-gradient(160deg,#20a26a 0%,#27b579 40%,#f3f5f4 40%)}
  .auth-head{padding:48px 28px 26px;color:#fff}
  .auth-head .logo{font-size:40px}
  .auth-head h2{font-size:26px;margin-top:10px}
  .auth-head p{opacity:.92;margin-top:6px;font-size:13px}
  .auth-card{margin:0 20px 20px;background:#fff;border-radius:20px;padding:24px 20px;box-shadow:var(--shadow);flex:1;overflow-y:auto}
  .seg{display:flex;background:#f0f2f1;border-radius:12px;padding:4px;margin-bottom:20px}
  .seg div{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg div.on{background:#fff;color:var(--green-d);box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .item-card{display:flex;gap:12px;padding:12px;margin-bottom:12px;cursor:pointer}
  .item-thumb{width:92px;height:92px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:44px;background:var(--green-l);overflow:hidden}
  .item-thumb img{width:100%;height:100%;object-fit:cover}
  .item-info{flex:1;min-width:0;display:flex;flex-direction:column}
  .item-info .t{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-info .meta{font-size:11px;color:var(--muted);margin-top:auto;display:flex;align-items:center;gap:6px}
  .price{color:#e0453a;font-weight:700}.price .u{font-size:11px}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px}
  .cats::-webkit-scrollbar{height:0}
  .chip{white-space:nowrap;font-size:13px;padding:7px 14px;border-radius:20px;background:#fff;
    border:1.5px solid var(--line);color:var(--muted);cursor:pointer;flex-shrink:0}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .search{margin:12px 16px 0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:24px;
    padding:10px 16px;box-shadow:var(--shadow)}
  .search input{border:none;background:none;outline:none;flex:1;font-size:14px}
  .detail-img{width:100%;height:280px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:110px}
  .detail-img img{width:100%;height:100%;object-fit:cover}
  .owner{display:flex;align-items:center;gap:10px;padding:14px 16px}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
  .verified{font-size:10px;color:var(--green);background:var(--green-l);padding:2px 6px;border-radius:6px;font-weight:600}
  .actbar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px;display:flex;gap:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom));z-index:8}
  .actbar .btn{flex:1}
  .offer{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
  .offer:last-child{border-bottom:none}
  .prof-head{background:linear-gradient(135deg,var(--green),#27b579);padding:24px 20px 40px;color:#fff}
  .prof-head .row{display:flex;align-items:center;gap:14px}
  .prof-head .avatar{width:60px;height:60px;font-size:24px;background:rgba(255,255,255,.25)}
  .prof-stats{display:flex;background:#fff;margin:-24px 16px 0;border-radius:16px;box-shadow:var(--shadow);padding:16px 0}
  .prof-stats div{flex:1;text-align:center;border-right:1px solid var(--line)}
  .prof-stats div:last-child{border:none}
  .prof-stats .n{font-size:20px;font-weight:700;color:var(--green-d)}
  .prof-stats .l{font-size:11px;color:var(--muted);margin-top:3px}
  .menu{margin:14px 16px}
  .menu-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .menu-item:last-child{border:none}
  .menu-item .ar{margin-left:auto;color:#ccc}
  .msg-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
  .msg-row .dot{width:9px;height:9px;border-radius:50%;background:#ef4444;flex-shrink:0;margin-top:6px}
  .msg-row .dot.read{background:transparent}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:up .25s;max-height:80%;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h3{font-size:17px;margin-bottom:16px;text-align:center}
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);
    color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;z-index:99;animation:fade .2s;max-width:80%;text-align:center}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb-add{width:70px;height:70px;border-radius:12px;border:1.5px dashed var(--line);display:flex;
    align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:24px;cursor:pointer;background:#fafbfb}
  .thumb-pick{width:70px;height:70px;border-radius:12px;background:var(--green-l);display:flex;
    align-items:center;justify-content:center;font-size:34px;cursor:pointer;position:relative;border:2px solid transparent}
  .thumb-pick.on{border-color:var(--green)}
  .divider{height:8px;background:var(--bg)}
  .section-title{font-size:14px;font-weight:700;padding:14px 16px 8px}
  /* 聊天 */
  .chat-body{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
  .bubble{max-width:75%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-all}
  .bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
  .bubble.peer{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:4px}
  .chat-input{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .chat-input input{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;outline:none;font-size:14px}
  .chat-input button{border:none;background:var(--green);color:#fff;border-radius:20px;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer}
  /* 星星 */
  .stars{display:flex;gap:6px;justify-content:center;font-size:32px;cursor:pointer;margin:8px 0 14px}
  .stars span{filter:grayscale(1);opacity:.4;transition:.1s}
  .stars span.on{filter:none;opacity:1}
  .rtags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  /* 小区示意图 */
  .map-box{background:#eef6f1;border-radius:14px;overflow:hidden;position:relative}
  .pp-row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
  .pp-row:last-child{border:none}
  .pp-row.sel{background:var(--green-l)}
  .steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:18px;font-size:12px;color:var(--muted)}
  .steps b{color:var(--green-d)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= API 层 ================= */
const API = new URLSearchParams(location.search).get('api') || window.__API_BASE__ || '';
let token = localStorage.getItem('ll2_token') || '';
async function api(path, method = 'GET', body) {
  const r = await fetch(API + path, {
    method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({ ok: false, msg: '网络异常' }));
  if (r.status === 401) { token = ''; localStorage.removeItem('ll2_token'); state.tab = 'auth'; render(); throw new Error('未登录'); }
  if (!j.ok) { toast(j.msg || '请求失败'); throw new Error(j.msg); }
  return j.data;
}

const CATS=[{id:'digital',name:'数码电器',emoji:'📱'},{id:'home',name:'家居日用',emoji:'🛋️'},{id:'kids',name:'母婴儿童',emoji:'🧸'},
{id:'book',name:'图书文具',emoji:'📚'},{id:'cloth',name:'服饰鞋包',emoji:'👗'},{id:'kitchen',name:'厨房用品',emoji:'🍳'},
{id:'sport',name:'运动户外',emoji:'⚽'},{id:'plant',name:'绿植花艺',emoji:'🪴'},{id:'other',name:'其他',emoji:'📦'}];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[8];
const timeAgo=t=>{const s=(Date.now()-t)/1000;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';if(s<86400)return Math.floor(s/3600)+'小时前';return Math.floor(s/86400)+'天前';};
const esc=s=>(''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 状态 ================= */
let state={tab:'auth',cat:'all',kw:'',detailId:null,chatPeer:null,me:null,unread:0,communities:[],detail:null};
const $app=document.getElementById('app');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$app.appendChild(t);setTimeout(()=>t.remove(),1800);}
let sheetEl=null;
function openSheet(html){closeSheet();const m=document.createElement('div');m.className='mask';
  m.innerHTML=`<div class="sheet">${html}</div>`;m.onclick=e=>{if(e.target===m)closeSheet();};$app.appendChild(m);sheetEl=m;}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null;}}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

/* ================= SSE 实时推送 ================= */
let es=null;
function connectSSE(){
  if(es)es.close();
  if(!token)return;
  es=new EventSource(API+'/api/events?token='+token);
  es.addEventListener('message_new',e=>{
    const d=JSON.parse(e.data);
    if(state.tab==='chat'&&state.chatPeer===d.from.id){loadChat();}
    else{toast('💬 '+d.from.nickname+'：'+d.msg.content.slice(0,20));refreshUnread();}
  });
  es.addEventListener('offer_new',e=>{const d=JSON.parse(e.data);toast('📨 你的「'+d.title+'」收到新意向');refreshUnread();if(state.tab==='detail')openDetail(state.detailId);});
  es.addEventListener('offer_update',e=>{const d=JSON.parse(e.data);toast(d.status==='accepted'?'✅ 你的意向被接受了！':'❌ 你的意向被婉拒');refreshUnread();if(state.tab==='detail')openDetail(state.detailId);});
  es.addEventListener('review_new',()=>toast('⭐ 你收到一条新评价'));
}
async function refreshUnread(){
  try{
    const ns=await api('/api/notifications');
    const convs=await api('/api/conversations');
    state.unread=ns.filter(n=>!n.read&&(n.kind==='out'||n.offer.status==='pending')).length+convs.reduce((s,c)=>s+c.unread,0);
    const el=document.getElementById('unread-badge');
    if(el){el.textContent=state.unread;el.style.display=state.unread?'':'none';}
  }catch(e){}
}

/* ================= 渲染 ================= */
async function render(){
  if(!token){renderAuth();return;}
  if(!state.me){try{state.me=await api('/api/me');}catch(e){return;}}
  if(!state.me.verified&&!['realname'].includes(state.tab)){state.tab='realname';}
  const views={home:viewHome,publish:viewPublish,msg:viewMsg,me:viewMe,detail:viewDetail,mylist:viewMyList,realname:viewRealname,chat:viewChat,deals:viewDeals,pickup:viewPickup};
  const html=await (views[state.tab]||viewHome)();
  $app.innerHTML=html+tabbar();
  bind();
  if(['home','mylist','msg','me'].includes(state.tab))refreshUnread();
}
function tabbar(){
  if(['detail','chat','realname','auth','pickup'].includes(state.tab))return'';
  const T=(id,ic,label)=>`<div class="tab ${state.tab===id?'active':''}" data-tab="${id}"><div class="ic">${ic}</div>${label}</div>`;
  return `<div class="tabbar">
    ${T('home','🏠','首页')}${T('mylist','🧾','我发布')}
    <div class="tab" data-tab="publish"><div class="pub">+</div></div>
    <div class="tab ${state.tab==='msg'?'active':''}" data-tab="msg"><div class="ic">💬</div>消息<span class="badge-dot" id="unread-badge" style="display:${state.unread?'':'none'}">${state.unread}</span></div>
    ${T('me','👤','我的')}
  </div>`;
}

/* ================= 登录/注册 ================= */
let authMode='login',loginWay='pwd',smsTimer=0;
function renderAuth(){
  $app.innerHTML=`
  <div class="auth-wrap">
    <div class="auth-head"><div class="logo">🏘️</div><h2>邻里集</h2>
      <p>小区闲置，就近流转 · 实名邻居，安心交易</p></div>
    <div class="auth-card">
      <div class="seg"><div class="${authMode==='login'?'on':''}" data-m="login">登录</div>
        <div class="${authMode==='reg'?'on':''}" data-m="reg">注册</div></div>
      <div id="authForm">${authMode==='login'?loginForm():regForm()}</div>
      <div style="display:flex;align-items:center;gap:10px;margin:18px 0 14px">
        <div style="flex:1;height:1px;background:var(--line)"></div>
        <span class="muted" style="font-size:12px">第三方登录</span>
        <div style="flex:1;height:1px;background:var(--line)"></div></div>
      <button class="btn wx" id="wx-btn">💚 微信一键登录</button>
      <p class="muted center" style="font-size:11px;margin-top:12px">登录即代表同意《用户协议》《隐私政策》</p>
    </div>
  </div>`;
  document.querySelectorAll('.seg div').forEach(d=>d.onclick=()=>{authMode=d.dataset.m;renderAuth();});
  bindAuth();
}
function smsBtnHtml(){return `<button class="btn sm ghost" id="sms-btn" style="white-space:nowrap">${smsTimer>0?smsTimer+'s后重发':'获取验证码'}</button>`;}
function loginForm(){
  return `
  <div class="seg" style="margin-bottom:16px">
    <div class="${loginWay==='pwd'?'on':''}" data-w="pwd">密码登录</div>
    <div class="${loginWay==='sms'?'on':''}" data-w="sms">验证码登录</div></div>
  <div class="field"><label>手机号</label><input class="input" id="lg-phone" placeholder="请输入手机号" value="13800000001"/></div>
  ${loginWay==='pwd'
    ?`<div class="field"><label>密码</label><input class="input" id="lg-pwd" type="password" value="123456" placeholder="请输入密码"/></div>`
    :`<div class="field"><label>短信验证码</label><div style="display:flex;gap:8px"><input class="input" id="lg-code" placeholder="6位验证码" maxlength="6"/>${smsBtnHtml()}</div></div>`}
  <button class="btn" id="lg-btn" style="margin-top:6px">登录</button>
  <p class="muted center" style="font-size:12px;margin-top:12px">体验账号 13800000001~03 / 密码 123456</p>`;
}
function regForm(){
  return `
  <div class="field"><label>手机号</label><input class="input" id="rg-phone" placeholder="接收验证码的手机号"/></div>
  <div class="field"><label>短信验证码</label><div style="display:flex;gap:8px"><input class="input" id="rg-code" placeholder="6位验证码" maxlength="6"/>${smsBtnHtml()}</div></div>
  <div class="field"><label>设置密码</label><input class="input" id="rg-pwd" type="password" placeholder="6位以上"/></div>
  <button class="btn" id="rg-btn">注册</button>
  <p class="muted center" style="font-size:12px;margin-top:12px">注册后需完成实名认证方可交易</p>`;
}
function bindAuth(){
  document.querySelectorAll('[data-w]').forEach(d=>d.onclick=()=>{loginWay=d.dataset.w;renderAuth();});
  const smsBtn=document.getElementById('sms-btn');
  if(smsBtn)smsBtn.onclick=async()=>{
    if(smsTimer>0)return;
    const phone=val('lg-phone')||val('rg-phone');
    if(!/^1\d{10}$/.test(phone))return toast('请输入正确的手机号');
    const r=await api('/api/sms/send','POST',{phone,scene:authMode});
    toast(r.devCode?`📩 验证码已发送（演示：${r.devCode}）`:'📩 验证码已发送');
    if(r.devCode){const c=document.getElementById('lg-code')||document.getElementById('rg-code');if(c)c.value=r.devCode;}
    smsTimer=60;const iv=setInterval(()=>{smsTimer--;const b=document.getElementById('sms-btn');
      if(b)b.textContent=smsTimer>0?smsTimer+'s后重发':'获取验证码';if(smsTimer<=0)clearInterval(iv);},1000);
  };

function bindRealname(){
  const f=document.getElementById('rn-file');
  if(f)f.onchange=async e=>{
    if(!e.target.files.length)return;
    const r=new FileReader();
    r.onload=async()=>{
      toast('🔍 OCR 识别中…');
      const o=await api('/api/realname/ocr','POST',{image:r.result.slice(0,100)});
      rnOcr.uploaded=true;
      if(o.name){rnOcr.name=o.name;rnOcr.idcard=o.idcard;}
      toast(o.mock?'✅ 已上传（演示模式请手动确认信息）':'✅ OCR识别完成');
      render();
    };
    r.readAsDataURL(e.target.files[0]);
  };
  const s=document.getElementById('rn-submit');
  if(s)s.onclick=async()=>{
    rnOcr.name=val('rn-name');rnOcr.idcard=val('rn-id');
    await api('/api/realname/verify','POST',{name:val('rn-name'),idcard:val('rn-id'),
      community_id:val('rn-com'),building:val('rn-b'),unit:val('rn-u'),room:val('rn-r')});
    toast('✅ 公安核验通过，实名认证成功！');

}

        <div style="display:flex;align-items:center;gap:8px">
          <b style="flex:1;font-size:14px">${esc(d.title)}</b>
          <span class="tag ${d.role==='seller'?'bid':'swap'}">${d.role==='seller'?'我卖出':'我买入'}</span></div>
        <div class="muted" style="font-size:12px;margin-top:6px">交易对象：${esc(d.peer?.nameMasked||d.peer?.nickname||'')} · ${timeAgo(d.created_at)}</div>
        ${d.pickup?`<div style="font-size:12px;margin-top:4px;color:var(--green-d)">📍 自提点：${esc(d.pickup.name)}（${esc(d.pickup.descr)}）</div>`:''}
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">

const R_TAGS=['守时守约','物品与描述一致','沟通友善','价格实在','邻里好评'];
let rvStars=5,rvTags=new Set();
function openReview(dealId){
  rvStars=5;rvTags=new Set();
  openSheet(`<h3>⭐ 评价这次交易</h3>
    <div class="stars" id="rv-stars">${[1,2,3,4,5].map(n=>`<span data-s="${n}" class="on">⭐</span>`).join('')}</div>
    <div class="rtags" id="rv-tags">${R_TAGS.map(t=>`<div class="chip" data-t="${t}">${t}</div>`).join('')}</div>
    <div class="field"><input class="input" id="rv-comment" placeholder="补充评价（选填）"/></div>
    <button class="btn" id="rv-ok">提交评价</button>
    <p class="muted center" style="font-size:11px;margin-top:8px">五星+1信用分 · 三星-1 · 两星以下-3</p>`);
  const paint=()=>document.querySelectorAll('#rv-stars span').forEach(s=>s.classList.toggle('on',+s.dataset.s<=rvStars));
  document.querySelectorAll('#rv-stars span').forEach(s=>s.onclick=()=>{rvStars=+s.dataset.s;paint();});
  document.querySelectorAll('#rv-tags .chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.t;rvTags.has(t)?rvTags.delete(t):rvTags.add(t);c.classList.toggle('on');});
  document.getElementById('rv-ok').onclick=async()=>{
    await api('/api/deals/'+dealId+'/review','POST',{stars:rvStars,tags:[...rvTags],comment:val('rv-comment')});
    closeSheet();toast('✅ 评价成功');render();
  };
}

      <div style="font-size:12px;opacity:.9;margin-top:4px">📍 ${esc(u.community?.name||'')} · ${esc(u.building)}栋${esc(u.unit)}单元${esc(u.room)}室</div>

async function showReviews(userId,title){
  const rs=await api('/api/users/'+userId+'/reviews');
  openSheet(`<h3>${title}</h3>
    ${rs.length?rs.map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="font-size:13px"><b>${esc(r.from?.nameMasked||r.from?.nickname||'邻居')}</b> ${'⭐'.repeat(r.stars)}</div>
      ${r.tags.length?`<div style="margin-top:4px">${r.tags.map(t=>`<span class="tag free" style="margin-right:4px">${esc(t)}</span>`).join('')}</div>`:''}
      ${r.comment?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(r.comment)}</div>`:''}
    </div>`).join(''):'<div class="empty">暂无评价</div>'}`);
}

/* ================= 事件绑定 ================= */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{
    if(e.dataset.tab==='publish')pub={deal:'bid',cat:'digital',imgs:[]};
    state.tab=e.dataset.tab;render();});
  document.querySelectorAll('[data-goto]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.goto;render();});
  document.querySelectorAll('[data-back]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.back;render();});
  document.querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>openDetail(+e.dataset.item));
  document.querySelectorAll('[data-mt]').forEach(e=>e.onclick=()=>{msgTab=e.dataset.mt;api('/api/notifications/read','POST',{}).catch(()=>{});render();});
  document.querySelectorAll('[data-chatpeer]').forEach(e=>e.onclick=()=>{state.chatPeer=+e.dataset.chatpeer;state.tab='chat';render();});
  document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>{
    const a=e.dataset.act;
    if(['mylist','deals','pickup','msg'].includes(a)){state.tab=a;render();}
    else if(a==='rninfo')openSheet(`<h3>🛡️ 实名认证信息</h3>
      <div style="font-size:14px;line-height:2.2;padding:0 6px">
      姓名：${esc(state.me.name)}<br/>身份证：${esc(state.me.idcard)}<br/>
      小区：${esc(state.me.community?.name||'')}<br/>住址：${esc(state.me.building)}栋${esc(state.me.unit)}单元${esc(state.me.room)}室<br/>
      核验通道：OCR识别 + 公安二要素比对 ✓</div>`);
    else if(a==='myreviews')showReviews(state.me.id,'⭐ 我收到的评价');
    else if(a==='rules')openSheet(`<h3>📋 平台交易规则</h3>
      <div style="font-size:13px;line-height:2;color:#456;padding:0 6px">
      1. 仅限实名认证的本小区住户交易；<br/>2. 支持出价认领、以物换物、免费赠送；<br/>
      3. 成交后请到小区自提点当面交接；<br/>4. 双方互评，信用分低于60将限制发布；<br/>
      5. 禁止发布违禁品、活体、处方药等。</div>`);
  });
  document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{state.cat=e.dataset.cat;render();});
  const kw=document.getElementById('kw');
  if(kw){kw.onkeydown=e=>{if(e.key==='Enter'){state.kw=kw.value.trim();render();}};}
  const lo=document.getElementById('logout');
  if(lo)lo.onclick=()=>{token='';localStorage.removeItem('ll2_token');state.me=null;if(es)es.close();state.tab='auth';render();};
  if(state.tab==='realname')bindRealname();
  bindPublish();bindDetail();bindChat();
  document.querySelectorAll('[data-review]').forEach(e=>e.onclick=()=>openReview(+e.dataset.review));
  document.querySelectorAll('[data-reviews]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();showReviews(+e.dataset.reviews,'⭐ TA收到的评价');});
}

function bindPublish(){
  document.querySelectorAll('[data-deal]').forEach(e=>e.onclick=()=>{pub.deal=e.dataset.deal;
    const box=document.getElementById('pub-extra');if(box)box.innerHTML=pubExtra();
    document.querySelectorAll('[data-deal]').forEach(x=>x.style.background=x.dataset.deal===pub.deal?'':'#f6f7f7');});
  document.querySelectorAll('[data-pcat]').forEach(e=>e.onclick=()=>{pub.cat=e.dataset.pcat;
    document.querySelectorAll('[data-pcat]').forEach(x=>x.classList.toggle('on',x.dataset.pcat===pub.cat));});
  const file=document.getElementById('pub-file');
  if(file)file.onchange=e=>{
    const fs=[...e.target.files].slice(0,4-pub.imgs.length);let n=fs.length;if(!n)return;
    fs.forEach(f=>{const r=new FileReader();r.onload=()=>{pub.imgs.push(r.result);if(--n===0)render();};r.readAsDataURL(f);});};
  document.querySelectorAll('[data-del]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();pub.imgs.splice(+e.dataset.del,1);render();});
  const sub=document.getElementById('pub-submit');
  if(sub)sub.onclick=async()=>{
    await api('/api/items','POST',{title:val('pub-title'),cat:pub.cat,cond:val('pub-cond'),deal:pub.deal,
      price:+val('pub-price')||0,wish:val('pub-wish'),desc:val('pub-desc'),imgs:pub.imgs});
    toast('🎉 发布成功，已展示给小区邻居');
    pub={deal:'bid',cat:'digital',imgs:[]};
    setTimeout(()=>{state.tab='mylist';render();},700);
  };
}

function bindDetail(){
  const bid=document.querySelector('[data-bid]');
  if(bid)bid.onclick=()=>{const i=state.detail;
    openSheet(`<h3>💰 出价认领</h3>
      <div class="field"><label>你的出价（元）· 卖家期望 ¥${i.price}</label><input class="input" id="of-amt" type="number" placeholder="输入你愿意支付的价格"/></div>
      <div class="field"><label>留言（选填）</label><input class="input" id="of-msg" placeholder="如：随时可自提，诚心购买"/></div>
      <button class="btn amber" id="of-ok">确认出价</button>`);
    document.getElementById('of-ok').onclick=()=>sendOffer(i.id,{type:'bid',amount:+val('of-amt'),msg:val('of-msg')});};
  const swap=document.querySelector('[data-swap]');
  if(swap)swap.onclick=()=>{const i=state.detail;
    openSheet(`<h3>🔄 发起交换</h3>
      <div style="background:var(--blue-l);border-radius:10px;padding:10px 12px;font-size:13px;color:#1d4ed8;margin-bottom:14px">对方想换：${esc(i.wish||'邻里换物')}</div>
      <div class="field"><label>你用来交换的物品</label><input class="input" id="of-item" placeholder="如：闲置儿童滑板车 九成新"/></div>
      <div class="field"><label>留言（选填）</label><input class="input" id="of-msg"/></div>
      <button class="btn" id="of-ok">发送交换请求</button>`);
    document.getElementById('of-ok').onclick=()=>sendOffer(i.id,{type:'swap',swap_item:val('of-item'),msg:val('of-msg')});};
  const claim=document.querySelector('[data-claim]');
  if(claim)claim.onclick=()=>{const i=state.detail;
    openSheet(`<h3>🎁 我要领取</h3>
      <div class="field"><label>给邻居留言</label><input class="input" id="of-msg" placeholder="如：真的很需要，谢谢您！"/></div>
      <button class="btn" id="of-ok">确认领取意向</button>`);
    document.getElementById('of-ok').onclick=()=>sendOffer(i.id,{type:'free',msg:val('of-msg')});};

  /* 卖家接受：先选自提点 */
  document.querySelectorAll('[data-accept]').forEach(e=>e.onclick=async()=>{
    const pps=await api('/api/pickup-points');
    let sel=pps[0]?.id;
    openSheet(`<h3>✅ 接受意向 · 选择自提点</h3>
      <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:14px">
        ${pps.map(p=>`<div class="pp-row ${p.id===sel?'sel':''}" data-pp="${p.id}">
          <span style="font-size:18px">📍</span>
          <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(p.name)}</div>
          <div class="muted" style="font-size:12px">${esc(p.descr)}</div></div></div>`).join('')||'<div class="empty" style="padding:20px">暂无自提点，可直接成交后私信约定</div>'}
      </div>
      <button class="btn" id="acc-ok">确认成交</button>`);
    document.querySelectorAll('[data-pp]').forEach(r=>r.onclick=()=>{sel=+r.dataset.pp;
      document.querySelectorAll('[data-pp]').forEach(x=>x.classList.toggle('sel',+x.dataset.pp===sel));});
    document.getElementById('acc-ok').onclick=async()=>{
      await api('/api/offers/'+e.dataset.accept+'/accept','POST',{pickup_point_id:sel});
      closeSheet();toast('🤝 已成交！自提点已通知对方');openDetail(state.detailId);};
  });
  document.querySelectorAll('[data-reject]').forEach(e=>e.onclick=async()=>{
    await api('/api/offers/'+e.dataset.reject+'/reject','POST',{});toast('已拒绝该意向');openDetail(state.detailId);});
  const off=document.querySelector('[data-off]');
  if(off)off.onclick=async()=>{
    if(off.dataset.st==='done')return toast('已成交的物品无需操作');
    await api('/api/items/'+off.dataset.off+'/status','POST',{status:off.dataset.st==='on'?'off':'on'});
    toast(off.dataset.st==='on'?'已下架':'已重新上架');openDetail(state.detailId);};
  document.querySelectorAll('[data-chat]').forEach(e=>e.onclick=()=>{state.chatPeer=+e.dataset.chat;state.tab='chat';render();});
}
async function sendOffer(itemId,data){
  if(data.type==='bid'&&!data.amount)return toast('请输入出价金额');
  if(data.type==='swap'&&!data.swap_item)return toast('请填写交换物品');
  await api('/api/items/'+itemId+'/offers','POST',data);
  closeSheet();toast('✅ 已发送，等待邻居确认');openDetail(itemId);
}
function bindChat(){
  const send=document.getElementById('chat-send');
  if(!send)return;
  const box=document.querySelector('.chat-body');if(box)box.scrollTop=box.scrollHeight;
  const doSend=async()=>{
    const t=val('chat-txt');if(!t)return;
    document.getElementById('chat-txt').value='';
    await api('/api/messages','POST',{to:state.chatPeer,content:t});
    loadChat();};
  send.onclick=doSend;
  document.getElementById('chat-txt').onkeydown=e=>{if(e.key==='Enter')doSend();};
}

/* ================= 启动 ================= */
if(token){state.tab='home';connectSSE();}
render();
</script>
